# Mosquitto Configuration for Sentinel Twin
# ─────────────────────────────────────────────
# Place this at: /etc/mosquitto/conf.d/sentinel.conf
# Then restart: sudo systemctl restart mosquitto

# ── Listener ─────────────────────────────────
# Listen on all interfaces so the ESP32 can reach us over WiFi
listener 1883
protocol mqtt

# ── Authentication ───────────────────────────
# For demo/development: allow anonymous connections
# This is fine on a private LAN. For production, comment this out
# and use password authentication (see below).
allow_anonymous true

# To enable password auth:
#   1. Comment out "allow_anonymous true" above
#   2. Uncomment the two lines below
#   3. Create a password file:
#      sudo mosquitto_passwd -c /etc/mosquitto/passwd sentinel
#   4. Restart mosquitto
#
# allow_anonymous false
# password_file /etc/mosquitto/passwd

# ── Persistence ──────────────────────────────
# Retain messages survive broker restarts (important for LWT status)
persistence true
persistence_location /var/lib/mosquitto/

# ── Logging ──────────────────────────────────
log_dest syslog
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── Limits ───────────────────────────────────
# Max message size (256 KB is plenty for sensor JSON)
message_size_limit 262144

# Max queued messages per client
max_queued_messages 1000

# ── WebSocket (optional) ─────────────────────
# Uncomment to enable WebSocket access from a browser-based MQTT client
# listener 9001
# protocol websockets
